# Cloudflare Workers config. See website/README.md for the deploy steps.
name = "daamdekho"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "daamdekho"
# Paste the id printed by `npx wrangler d1 create daamdekho`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SITE_NAME = "DaamDekho"
# Public address of this site, no trailing slash (used in share links and SEO tags).
SITE_URL = "https://daamdekho.example.workers.dev"
# Chrome Web Store link of the extension, once published. Empty hides the button.
EXTENSION_URL = ""
# Telegram channel link (phase 3). Empty hides it.
TELEGRAM_URL = ""
# Affiliate deep-link templates from your network (Cuelinks, EarnKaro, ...).
# {url} is replaced with the encoded product URL. Empty = plain links.
FLIPKART_TEMPLATE = ""
MYNTRA_TEMPLATE = ""

# Secret, not stored here. Set it with: npx wrangler secret put CLIENT_SALT
# (any long random string; it anonymises the extension's client ids).

# Daily cleanup of old rate-limit counters (UTC).
[triggers]
crons = ["17 21 * * *"]
